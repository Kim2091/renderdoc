name: DX9 Release Build

on:
  release:
    types: [published]

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Windows x64 Release
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 5

    - name: Cache 3rdparty extras
      id: cache-3rdparty
      uses: actions/cache@v4
      with:
        path: |
          3rdparty
          PySide2
        key: renderdoc-3rdparty-v1

    - name: Download optional 3rdparty extras
      if: steps.cache-3rdparty.outputs.cache-hit != 'true'
      run: |
        curl https://renderdoc.org/qrenderdoc_3rdparty.zip -O
        7z x qrenderdoc_3rdparty.zip
        rm -f qrenderdoc_3rdparty.zip

    - name: Cache build objects
      uses: actions/cache@v4
      with:
        path: x64/Release/obj
        key: msbuild-release-x64-${{ hashFiles('renderdoc/**/*.cpp', 'renderdoc/**/*.h', 'qrenderdoc/**/*.cpp', 'qrenderdoc/**/*.h') }}
        restore-keys: |
          msbuild-release-x64-

    - name: Set up Visual Studio tools
      uses: microsoft/setup-msbuild@v2

    - name: Build solution
      run: msbuild.exe renderdoc.sln "/m" "/p:Configuration=Release" "/p:Platform=x64" "/p:PlatformToolset=v143"
      shell: powershell

    - name: Package
      run: |
        mkdir -p package/RenderDoc_DX9
        cp x64/Release/renderdoc.dll package/RenderDoc_DX9/
        cp x64/Release/renderdoc.json package/RenderDoc_DX9/
        cp x64/Release/renderdoccmd.exe package/RenderDoc_DX9/
        cp x64/Release/qrenderdoc.exe package/RenderDoc_DX9/
        cp x64/Release/renderdocshim64.dll package/RenderDoc_DX9/
        cp x64/Release/renderdoc_app.h package/RenderDoc_DX9/
        cp x64/Release/d3dcompiler_47.dll package/RenderDoc_DX9/
        cp x64/Release/dbghelp.dll package/RenderDoc_DX9/
        cp x64/Release/Qt5*.dll package/RenderDoc_DX9/
        cp x64/Release/python36.dll package/RenderDoc_DX9/
        cp x64/Release/python36.zip package/RenderDoc_DX9/
        cp x64/Release/_ctypes.pyd package/RenderDoc_DX9/
        mkdir -p package/RenderDoc_DX9/pymodules
        cp x64/Release/pymodules/*.pyd package/RenderDoc_DX9/pymodules/
        cp -r x64/Release/plugins package/RenderDoc_DX9/plugins 2>/dev/null || true
        cp -r x64/Release/qtplugins package/RenderDoc_DX9/qtplugins 2>/dev/null || true
        cd package && 7z a -tzip ../RenderDoc_DX9_Windows_x64.zip RenderDoc_DX9/

    - name: Upload to release
      uses: softprops/action-gh-release@v2
      with:
        files: RenderDoc_DX9_Windows_x64.zip

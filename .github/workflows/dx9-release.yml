name: DX9 Release Build

on:
  release:
    types: [published]

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Windows x64 Release
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 5

    - name: Cache 3rdparty extras
      id: cache-3rdparty
      uses: actions/cache@v4
      with:
        path: qrenderdoc/3rdparty
        key: renderdoc-3rdparty-v1

    - name: Download optional 3rdparty extras
      if: steps.cache-3rdparty.outputs.cache-hit != 'true'
      run: |
        curl https://renderdoc.org/qrenderdoc_3rdparty.zip -O
        7z x qrenderdoc_3rdparty.zip
        rm -f qrenderdoc_3rdparty.zip

    - name: Cache plugins
      id: cache-plugins
      uses: actions/cache@v4
      with:
        path: |
          plugins-win64
          plugins-win32
        key: renderdoc-plugins-v1

    - name: Download plugins
      if: steps.cache-plugins.outputs.cache-hit != 'true'
      run: |
        curl -O https://renderdoc.org/plugins.zip
        7z x plugins.zip
        rm -f plugins.zip

    - name: Cache build objects
      uses: actions/cache@v4
      with:
        path: |
          x64/Release/obj
          Win32/Release/obj
        key: msbuild-release-${{ hashFiles('renderdoc/**/*.cpp', 'renderdoc/**/*.h', 'qrenderdoc/**/*.cpp', 'qrenderdoc/**/*.h') }}
        restore-keys: |
          msbuild-release-

    - name: Set up Visual Studio tools
      uses: microsoft/setup-msbuild@v2

    - name: Set up Python and Sphinx
      run: |
        pip install Sphinx

    - name: Build x64 Release
      run: msbuild.exe renderdoc.sln "/m" "/p:Configuration=Release" "/p:Platform=x64" "/p:PlatformToolset=v143"
      shell: powershell

    - name: Build x86 Release
      run: msbuild.exe renderdoc.sln "/m" "/p:Configuration=Release" "/p:Platform=x86" "/p:PlatformToolset=v143"
      shell: powershell

    - name: Build documentation (CHM)
      run: |
        cd docs
        bash make.sh htmlhelp || true
        if [ -f ../Documentation/htmlhelp/renderdoc.chm ]; then
          cp ../Documentation/htmlhelp/renderdoc.chm ../x64/Release/
        fi

    - name: Package
      run: |
        PKG=package/RenderDoc_DX9
        mkdir -p $PKG

        # --- Core build outputs from x64/Release/ ---
        cp x64/Release/renderdoc.dll         $PKG/
        cp x64/Release/renderdoc.json        $PKG/
        cp x64/Release/renderdoccmd.exe      $PKG/
        cp x64/Release/qrenderdoc.exe        $PKG/
        cp x64/Release/renderdocshim64.dll   $PKG/
        cp x64/Release/renderdoc_app.h       $PKG/
        cp x64/Release/renderdocui.exe       $PKG/

        # --- System/debug DLLs ---
        cp x64/Release/d3dcompiler_47.dll    $PKG/
        cp x64/Release/dbghelp.dll           $PKG/
        cp x64/Release/symsrv.dll            $PKG/
        cp x64/Release/symsrv.yes            $PKG/

        # --- Qt DLLs ---
        cp x64/Release/Qt5*.dll              $PKG/

        # --- Python runtime ---
        cp x64/Release/python36.dll          $PKG/
        cp x64/Release/python36.zip          $PKG/
        cp x64/Release/_ctypes.pyd           $PKG/

        # --- Python modules (.pyd at root, matching stock layout) ---
        cp x64/Release/pymodules/renderdoc.pyd   $PKG/
        cp x64/Release/pymodules/qrenderdoc.pyd  $PKG/

        # --- Debug symbols and import libs ---
        cp x64/Release/renderdoc.pdb         $PKG/
        cp x64/Release/renderdoc.lib         $PKG/
        cp x64/Release/renderdoc.exp         $PKG/
        cp x64/Release/qrenderdoc.pdb        $PKG/
        cp x64/Release/qrenderdoc.lib        $PKG/
        cp x64/Release/qrenderdoc.exp        $PKG/

        # --- Qt plugins ---
        cp -r x64/Release/qtplugins          $PKG/qtplugins

        # --- Help file (if built) ---
        cp x64/Release/renderdoc.chm         $PKG/ 2>/dev/null || true

        # --- License ---
        cp LICENSE.md                        $PKG/

        # --- PySide2 + shiboken2 from 3rdparty zip (x64 variant) ---
        cp -r qrenderdoc/3rdparty/pyside/x64/PySide2  $PKG/PySide2
        cp    qrenderdoc/3rdparty/pyside/x64/shiboken2.dll $PKG/

        # --- SSL libs from 3rdparty zip ---
        cp qrenderdoc/3rdparty/qt/x64/bin/libcrypto-1_1-x64.dll $PKG/
        cp qrenderdoc/3rdparty/qt/x64/bin/libssl-1_1-x64.dll    $PKG/

        # --- Plugins (downloaded pre-built binaries) ---
        mkdir -p $PKG/plugins
        cp -r plugins-win64/* $PKG/plugins/ 2>/dev/null || true
        mkdir -p $PKG/plugins/android
        cp plugins-android/* $PKG/plugins/android/ 2>/dev/null || true

        # --- x86 subfolder (from Win32 build) ---
        mkdir -p $PKG/x86
        cp Win32/Release/renderdoc.dll       $PKG/x86/
        cp Win32/Release/renderdoc.json      $PKG/x86/
        cp Win32/Release/renderdoccmd.exe    $PKG/x86/
        cp Win32/Release/renderdocshim32.dll $PKG/x86/
        cp Win32/Release/d3dcompiler_47.dll  $PKG/x86/
        cp Win32/Release/dbghelp.dll         $PKG/x86/
        cp Win32/Release/symsrv.dll          $PKG/x86/
        cp Win32/Release/symsrv.yes          $PKG/x86/

        cd package && 7z a -tzip ../RenderDoc_DX9_Windows_x64.zip RenderDoc_DX9/

    - name: Upload to release
      uses: softprops/action-gh-release@v2
      with:
        files: RenderDoc_DX9_Windows_x64.zip
